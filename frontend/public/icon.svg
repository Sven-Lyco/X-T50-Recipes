<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="#1a1a1a"/>

  <!-- Camera body -->
  <rect x="68" y="186" width="376" height="248" rx="30" fill="#f0f0f0"/>

  <!-- Viewfinder bump -->
  <rect x="148" y="150" width="116" height="58" rx="16" fill="#f0f0f0"/>

  <!-- Lens outer ring -->
  <circle cx="252" cy="308" r="92" fill="#1a1a1a"/>
  <!-- Lens mid ring -->
  <circle cx="252" cy="308" r="72" fill="#2c2c2e"/>
  <!-- Lens inner -->
  <circle cx="252" cy="308" r="48" fill="#1a1a1a"/>
  <!-- Lens highlight -->
  <circle cx="238" cy="294" r="14" fill="white" opacity="0.25"/>
  <!-- Lens inner dot -->
  <circle cx="252" cy="308" r="16" fill="#111" opacity="0.8"/>

  <!-- Shutter button -->
  <circle cx="382" cy="168" r="24" fill="#c0392b"/>

  <!-- Flash / top bar detail -->
  <rect x="300" y="196" width="48" height="10" rx="5" fill="#ccc"/>
</svg>
