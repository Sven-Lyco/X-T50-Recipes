# Keeps the pinned Node.js and Temurin base images in the Dockerfile current: Dependabot
# opens a pull request when a newer release of the same major line is published.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    allow:
      # Only the Node.js and Temurin images are pinned to an exact release
      - dependency-name: node
      - dependency-name: eclipse-temurin
    ignore:
      # Moving to a new major is a deliberate decision, not a routine bump
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]

  # Keeps the GitHub Actions in .github/workflows current: one grouped pull request
  # per month, so the update does not cost many Actions minutes.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Keeps Spring Boot and the other Gradle dependencies current: one grouped pull request a
  # week for patch and minor releases, so security fixes such as Spring Boot 4.0.10 arrive by
  # themselves. Spring Framework and Spring Security follow through the Spring Boot BOM.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Moving to a new major is a deliberate decision, not a routine bump
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
