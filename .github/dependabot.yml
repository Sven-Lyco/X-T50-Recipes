# Keeps the pinned Node.js and Temurin base images in the Dockerfile current: Dependabot
# opens a pull request when a newer release of the same major line is published.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    allow:
      # Only the Node.js and Temurin images are pinned to an exact release
      - dependency-name: node
      - dependency-name: eclipse-temurin
    ignore:
      # Moving to a new major is a deliberate decision, not a routine bump
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]

  # Keeps the GitHub Actions in .github/workflows current: one grouped pull request
  # per month, so the update does not cost many Actions minutes.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
