services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xt50recipes
      POSTGRES_USER: xt50
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xt50}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xt50 -d xt50recipes"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    labels:
      - "traefik.http.middlewares.buffer-uploads.buffering.maxRequestBodyBytes=31457280"
      - "coolify.traefik.middlewares=buffer-uploads"
    environment:
      DB_URL: jdbc:postgresql://db:5432/xt50recipes
      DB_USERNAME: xt50
      DB_PASSWORD: ${DB_PASSWORD:-xt50}
      JWT_SECRET: ${JWT_SECRET}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      IMAGE_STORAGE_PATH: /app/images
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - images_data:/app/images
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  images_data: