spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xt50recipes}
    username: ${DB_USERNAME:xt50}
    password: ${DB_PASSWORD:xt50}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  jwt-secret: ${JWT_SECRET:dev-secret-change-me-in-production-must-be-32-chars}
  jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  image-storage-path: ${IMAGE_STORAGE_PATH:./images}
  admin-username: ${APP_ADMIN_USERNAME:admin}
  admin-password: ${APP_ADMIN_PASSWORD:}

server:
  port: 8080
  forward-headers-strategy: native