// Sicherheits-Overrides für transitive Abhängigkeiten (CVE-Fixes).
//
// Gegenstück zu "overrides" in frontend/package.json: hebt einzelne vom
// Spring-Boot-BOM verwalteten Versionen an, ohne die Boot-Version zu ändern.
// Einträge entfernen, sobald die eingesetzte Spring-Boot-Version mindestens
// diese Versionen selbst mitbringt.

// Spring-Boot-BOM-Properties (io.spring.dependency-management)
// CVE-2026-65905, CVE-2026-65182, CVE-2026-68525 (alle critical)
ext['tomcat.version'] = '10.1.60'
// CVE-2026-89425, CVE-2026-89407, CVE-2026-91777, CVE-2026-91776, CVE-2026-68497,
// CVE-2026-83557, CVE-2026-19032, CVE-2026-59889, CVE-2026-54515, CVE-2026-77310, GHSA-mhm7-754m-9p8w
ext['jackson-bom.version'] = '2.21.7'
// CVE-2026-49844
ext['log4j2.version'] = '2.25.5'
// CVE-2026-54291
ext['postgresql.version'] = '42.7.13'
// CVE-2025-48924 (transitiv über commons-compress, nur Test-Classpath)
ext['commons-lang3.version'] = '3.18.0'

// Nicht vom Spring-Boot-BOM verwaltete Abhängigkeiten
dependencyManagement {
    dependencies {
        // Transitiv über Testcontainers (nur Test-Classpath)
        // CVE-2024-26308, CVE-2024-25710
        dependency 'org.apache.commons:commons-compress:1.28.0'
    }
}
